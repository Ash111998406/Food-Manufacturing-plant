<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Singju Factory — 3D Layout</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { overflow:hidden; background:#050a10; font-family:'Segoe UI',Arial,sans-serif; touch-action:none; }
canvas { display:block; }

.panel {
  position:absolute; background:rgba(4,8,15,0.93);
  border:1px solid rgba(255,255,255,0.07); border-radius:10px;
  padding:10px 14px; color:#cfd8dc; pointer-events:none;
}
#ctl { bottom:96px; right:12px; font-size:10px; }
#ctl div { margin:2px 0; color:#37474f; }
#ctl span { color:#546e7a; }

#hint {
  position:fixed; bottom:0; left:0; right:0;
  text-align:center; padding:10px;
  font-size:12px; color:#4fc3f7;
  background:rgba(4,8,15,0.7);
  pointer-events:none; z-index:50;
  transition:opacity 0.6s;
}
#hint.gone { opacity:0; }

#popup {
  position:fixed; bottom:0; left:50%;
  transform:translateX(-50%) translateY(100%);
  transition:transform 0.28s cubic-bezier(.22,.68,0,1.2);
  width:min(460px, 96vw);
  background:rgba(4,8,15,0.98);
  border-top:3px solid var(--hc, #4fc3f7);
  border-left:1px solid rgba(255,255,255,0.09);
  border-right:1px solid rgba(255,255,255,0.09);
  border-radius:18px 18px 0 0;
  padding:16px 20px 30px;
  pointer-events:none; z-index:80;
}
#popup.show { transform:translateX(-50%) translateY(0); }
#popup .pname  { display:block; font-size:16px; font-weight:700; color:var(--hc,#4fc3f7); margin-bottom:6px; line-height:1.3; }
#popup .pzone  { display:block; font-size:10px; color:#546e7a; margin-bottom:6px; letter-spacing:.4px; }
#popup .pdesc  { display:block; font-size:11.5px; color:#90a4ae; line-height:1.55; margin-bottom:6px; }
#popup .pbudget{ display:block; font-size:10.5px; color:#a5d6a7; }
#popup .ptip   { display:block; font-size:9px; color:#37474f; margin-top:10px; text-align:center; }

@media (max-width:700px) { #ctl { display:none; } }
</style>
</head>
<body>

<div class="panel" id="ctl">
  <div><span>Drag</span> — Rotate</div>
  <div><span>Pinch</span> — Zoom</div>
  <div><span>Tap</span> — Identify</div>
</div>

<div id="hint">Tap any zone or object to identify it</div>

<div id="popup">
  <span class="pname"  id="pname"></span>
  <span class="pzone"  id="pzone"></span>
  <span class="pdesc"  id="pdesc"></span>
  <span class="pbudget"id="pbudget"></span>
  <span class="ptip">Tap same item to close · Tap another to switch</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
<script>
// Coordinate system: X -20..+20, Z -40..+40 (front=+40), Y=up
// DRY ZONE: X -20..0  (cx=-10, LEFT)
// WET ZONE: X 0..+20  (cx=+10, RIGHT)
// U-flow: WET side goes front→back (down), pass-through, DRY side goes back→front (up)

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x050a10);

var camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 600);
camera.position.set(0, 130, 100);

var renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
document.body.appendChild(renderer.domElement);

var orb = new THREE.OrbitControls(camera, renderer.domElement);
orb.enableDamping = true; orb.dampingFactor = 0.08;
orb.maxPolarAngle = Math.PI/2.05;
orb.minDistance = 18; orb.maxDistance = 280;
orb.target.set(0, 3, 0); orb.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
var sun = new THREE.DirectionalLight(0xfff8f0, 0.85);
sun.position.set(55, 90, 65); scene.add(sun);
var fill = new THREE.DirectionalLight(0x90caf9, 0.22);
fill.position.set(-55, 40, -60); scene.add(fill);
var under = new THREE.DirectionalLight(0x263238, 0.15);
under.position.set(0,-1,0); scene.add(under);

var WH = 11;

// ── Geometry helpers ──────────────────────────────────────────────────────────
function mkBox(w,h,d,col){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshLambertMaterial({color:col})); }
function mkCyl(r,h,col)  { return new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,18), new THREE.MeshLambertMaterial({color:col})); }
function mkFrus(rt,rb,h,col){ return new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,18), new THREE.MeshLambertMaterial({color:col})); }
function mkDome(r,col)   { return new THREE.Mesh(new THREE.SphereGeometry(r,18,9,0,Math.PI*2,0,Math.PI/2), new THREE.MeshLambertMaterial({color:col,transparent:true,opacity:0.6})); }
function mkDisc(r,h,col) { return new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,22), new THREE.MeshLambertMaterial({color:col})); }

function addLegs(tx,tz,tw,td,lh,col){
  var ox=tw/2-0.25, oz=td/2-0.25;
  [[ox,oz],[ox,-oz],[-ox,oz],[-ox,-oz]].forEach(function(o){
    var leg=mkCyl(0.08,lh,col||0x607d8b); leg.position.set(tx+o[0],lh/2+0.26,tz+o[1]); scene.add(leg);
  });
}
function addRack(x,z,w,d,H,shelves,pc,sc){
  [[w/2-.1,d/2-.1],[w/2-.1,-d/2+.1],[-w/2+.1,d/2-.1],[-w/2+.1,-d/2+.1]].forEach(function(o){
    var up=mkBox(0.12,H,0.12,pc||0x5d4037); up.position.set(x+o[0],H/2+0.26,z+o[1]); scene.add(up);
  });
  for(var s=0;s<shelves;s++){
    var sh=mkBox(w-.3,0.08,d-.3,sc||0x795548); sh.position.set(x,0.26+H/shelves*(s+.85),z); scene.add(sh);
  }
}

// ── Interactive arrays ────────────────────────────────────────────────────────
var zoneFloors = [];
var equipMeshes = [];

function addZone(z) {
  var geo = new THREE.BoxGeometry(z.w||20, 0.25, z.d||13);
  var mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({color:z.fc,transparent:true,opacity:0.92}));
  mesh.position.set(z.cx, 0.13, z.cz);
  mesh.userData = { type:'zone', zone:z };
  scene.add(mesh); zoneFloors.push(mesh);

  var el = new THREE.LineSegments(new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.07}));
  el.position.set(z.cx,0.13,z.cz); scene.add(el);

  (z.eq||[]).forEach(function(eq){
    var m;
    if      (eq.t==='box')  m=mkBox(eq.w,eq.h,eq.d,eq.c);
    else if (eq.t==='cyl')  m=mkCyl(eq.r,eq.h,eq.c);
    else if (eq.t==='frus') m=mkFrus(eq.rt,eq.rb,eq.h,eq.c);
    else if (eq.t==='dome') m=mkDome(eq.r,eq.c);
    else if (eq.t==='disc') m=mkDisc(eq.r,eq.h,eq.c);
    if(!m) return;
    var py=(eq.y!==undefined)?eq.y:(eq.t==='dome'?eq.r+0.26:eq.h/2+0.26);
    m.position.set(eq.x, py, eq.z);
    scene.add(m);
    if(!eq.skip){
      m.userData = { type:'eq', name:eq.n, zone:z };
      equipMeshes.push(m);
    }
  });
}

  var e=new THREE.LineSegments(new THREE.EdgesGeometry(g),edgeMat); e.position.set(px,WH/2,pz); scene.add(e);
}

sill.position.set(0,0.43,-33.5); scene.add(sill);
[-30.15,-36.85].forEach(function(z){
  var j=mkBox(0.8,WH,0.35,ptc); j.material.transparent=true; j.material.opacity=0.35;

var raycaster=new THREE.Raycaster();
var mouse=new THREE.Vector2();
var popup=document.getElementById('popup');
var pname=document.getElementById('pname');
var pzone=document.getElementById('pzone');
var pdesc=document.getElementById('pdesc');
var pbudget=document.getElementById('pbudget');
var hint=document.getElementById('hint');
var activeMesh=null;
var hintDone=false;

function showZone(z, mesh) {
  activeMesh=mesh;
  pname.textContent   = z.name;
  pzone.textContent   = '';
  pdesc.textContent   = z.desc;
  pbudget.textContent = 'Est. cost: '+z.budget;
  popup.style.setProperty('--hc', z.hc||'#4fc3f7');
  popup.classList.add('show');
  if(!hintDone){ hint.classList.add('gone'); hintDone=true; }
}
function showEq(ud, mesh) {
  activeMesh=mesh;
  pname.textContent   = ud.name;
  pzone.textContent   = '▸ '+ud.zone.name;
  pdesc.textContent   = '';
  pbudget.textContent = '';
  popup.style.setProperty('--hc', ud.zone.hc||'#4fc3f7');
  popup.classList.add('show');
  if(!hintDone){ hint.classList.add('gone'); hintDone=true; }
}
function closePopup(){
  activeMesh=null;
  popup.classList.remove('show');
}

function handleTap(cx, cy) {
  mouse.x=(cx/innerWidth)*2-1;
  mouse.y=-(cy/innerHeight)*2+1;
  raycaster.setFromCamera(mouse, camera);
  // Check equipment first (they sit on top of zone floors)
  var eHits=raycaster.intersectObjects(equipMeshes);
  if(eHits.length>0){
    var mesh=eHits[0].object;
    if(mesh===activeMesh){ closePopup(); return; }
    showEq(mesh.userData, mesh); return;
  }
  var zHits=raycaster.intersectObjects(zoneFloors);
  if(zHits.length>0){
    var mesh=zHits[0].object;
    if(mesh===activeMesh){ closePopup(); return; }
    showZone(mesh.userData.zone, mesh); return;
  }
  closePopup();
}

var tsX=0, tsY=0, lastTouch=0;
renderer.domElement.addEventListener('touchstart',function(e){
  tsX=e.touches[0].clientX; tsY=e.touches[0].clientY;
},{passive:true});
renderer.domElement.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-tsX, dy=e.changedTouches[0].clientY-tsY;
  if(Math.sqrt(dx*dx+dy*dy)<12){
    lastTouch=Date.now();
    handleTap(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
  }
},{passive:true});
renderer.domElement.addEventListener('click',function(e){
  if(Date.now()-lastTouch<600) return;
  handleTap(e.clientX,e.clientY);
});

window.addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
(function animate(){
  requestAnimationFrame(animate);
  orb.update();
  renderer.render(scene,camera);
})();
</script>
</body>
</html>
